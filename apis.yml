aid: candidhealth
url: https://raw.githubusercontent.com/api-evangelist/candidhealth/refs/heads/main/apis.yml
name: Candid Health
kind: company
description: Candid Health is an autonomous medical-billing and revenue-cycle management
  platform. Its REST API lets digital health providers submit encounters and claims,
  run real-time eligibility checks, capture charges, look up payers and fee schedules,
  reconcile remits/ERAs, and subscribe to billing events end-to-end.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Healthcare
- Medical Billing
- Revenue Cycle
- Claims
- Eligibility
created: '2026-06-21'
modified: '2026-06-21'
specificationVersion: '0.19'
